      note: "overlaps SOUL.md §7; trigger explicitly if both fire at once"
    - name: last30days
      repo: mvanhorn/last30days-skill
      enabled: true
    - name: graphify
      repo: Graphify-Labs/graphify
      enabled: true
    - name: understand-anything
      repo: Egonex-AI/Understand-Anything
      enabled: true
    - name: ponytail
      repo: DietrichGebert/ponytail
      enabled: true
    - name: diagram-design
      repo: cathrynlavery/diagram-design
      enabled: true
    - name: viserys-agent
      repo: rizqinrr/viserys-agent
      enabled: true
    - name: agentic-awesome-skills
      repo: sickn33/agentic-awesome-skills
      enabled: true
      note: "index repo, not one skill — vendored for lookup"
    - name: scientific-agent-skills
      repo: K-Dense-AI/scientific-agent-skills
      enabled: true
      bundle: true
      count: 166
  bundles:
    aas: { enabled: true, count: 2474 }
    ecc: { enabled: true, count: 292 }
    claude-red: { enabled: true, count: 78 }
    ai-tools: { enabled: true, count: 40 }
    caveman: { enabled: true, count: 20 }
    ponytail: { enabled: true, count: 6 }
    superpowers: { enabled: true, count: 15 }
    viserys: { enabled: true, count: 29 }
    security: { enabled: true, count: 2 }
    devops: { enabled: true, count: 4 }
    autonomous-ai-agents: { enabled: true, count: 8 }
    software-development: { enabled: true, count: 15 }
    productivity: { enabled: true, count: 18 }
    research: { enabled: true, count: 6 }
    media: { enabled: true, count: 3 }
    web: { enabled: true, count: 1 }

# ── PLUGINS ────────────────────────────────────────────────────────
plugins:
  enabled:
    - orca-status
    - superpowers
  disabled: []
  scan_on_install: true

# ── MCP ────────────────────────────────────────────────────────────
mcp_servers:
  - chrome-devtools

# ── INTERFACE / RICH MESSAGE ───────────────────────────────────────
# NOTE: key names below are the declared targets. If the local build names them
# differently, run ./probe-config.sh — it greps config_defaults.py and prints
# the real keys before you paste.
interface:
  rich_message: true
  markdown: true
  tables: true
  panels: true # box-drawn callout blocks
  collapsible_sections: true
  code_fence_language_always: true
  show_status_line: true
  show_timestamps: false
  show_token_ledger: false
  divider_style: "─"
  truncate_long_outputs: false # void wants the whole thing, not a preview

# ── OUTPUT STYLE ───────────────────────────────────────────────────
# The decorative half of the old scaffolding, kept because it's yours.
# Labelled honestly below so nothing here is mistaken for a behavior switch.
output_style:
  marker: "@void" # first token of every reply — identity, not ceremony
  banner: "void lab" # optional header text for report-style output
  godmode_label:
    false # cosmetic only. set true and it prints a
    # label. changes nothing about the output,
    # because a label can't — see the note at the
    # bottom of this block.
  divider:
    null # a divider string here would render between
    # the real answer and an echo of it. costs
    # tokens, adds noise. left null on purpose.
  max_depth_default: true # full implementations, exact commands, real params
  debug_surfaces: true # reasoning visible on request

# On GODMODE: the label, the divider, and "write the opposite" are inert as
# decoration and counterproductive as instruction. The label is available above
# if you want the ink. The inverse-output instruction is not written anywhere in
# this pack — mechanically it produces your real answer plus a second inverted
# answer plus a stamp, which is scroll time and tokens for nothing. Depth is
# bought with §1 of void-reach, not with a banner.

# ── RUNTIME ────────────────────────────────────────────────────────
runtime:
  parallel_tool_calls: true
  background_for_long_tasks: true
  verify_before_done: true
  artifact_presence_check: true
  notes_file: notes.md
  max_detail_default: high
  compress_casual_turns: true
