# config.yaml — void lab, everything enabled
# Target: ~/hermes/config.yaml
# Validate: python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" config.yaml
# Mode: FORCE-ENABLE. No skills parked, no plugins disabled, no dedupe pruning.
#       Duplicate map retained in SKILLS-AUDIT.md for optional use, not applied.

operator:
  name: void
  address_as: void
  persona: true # SOUL.md §2 active on every profile
  chat_language: mixed_id_en

soul:
  path: "~/hermes/SOUL.md"
  agents_path: "~/hermes/AGENTS.md"
  prefill_path: "~/hermes/prefill.txt"
  persona_layer: true
  apply_to_all_profiles: true

# ── SKILLS: FULL LOAD ──────────────────────────────────────────────
skills:
  auto_load: true
  load_all: true # every dir on the load path, no tier filter
  disabled: [] # nothing parked
  dedupe: false # keep the literal duplicates loaded
  external_dirs:
    - "~/hermes/skills"
    - "~/hermes/skills/external"
  project_discovery: true
  trusted_project_dirs: []
  creation_nudge_interval: 15
  template_vars: {}
  inline_shell: false
  guard_agent_created: true
  write_approval: true # keep: stops a bad skill from overwriting a good one at 3am
  ledger: true # keep: makes the next audit cheap

# ── TIERS ──────────────────────────────────────────────────────────
# load_all: true above supersedes this block. Kept as a declared tier map so
# load order and routing stay deterministic when load_all is switched off.
skill_tiers:
  always_on: # resolution priority, not a filter
    - void-persona
    - void-writing-craft
    - void-reach
    - rich-message
    - void-arsenal
    - effective-agent-skills
    - skill-router
    - skill-check
    - verification-before-completion
    - systematic-debugging
    - falsify
    - doubt-driven-development
    - anti-sycophancy
    - anti-deception
    - tdd
    - code-review-and-quality
    - clean-code
    - git-workflow
    - create-pr
    - context-engineering
    - strategic-compact
    - agent-memory
    - deep-research
    - grounded-citations
    - telegram
    - cron-doctor
    - mcp-server-lifecycle

  on_demand: [] # empty: load_all covers everything
  parked: [] # empty: nothing parked

